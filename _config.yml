title: Lawton Hall

url: "https://www.lawtonhall.com"
baseurl: ""

collections:
  works:
    output: true
    permalink: /works/:name/

  practice:
    output: true
    permalink: /practice/:name/

  clicks:
    output: true
    permalink: /clicks/:name/

defaults:
  - scope:
      path: "talks"
    values:
      layout: default
      theme: pink
      noindex: true
      sitemap: false

  - scope:
      path: ""
      type: clicks
    values:
      layout: click
      noindex: true
      sitemap: false
